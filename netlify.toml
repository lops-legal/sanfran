[build]
  base = "apps/next-web"
  command = "npm run build"

# Next.js App Router — o Netlify detecta o framework automaticamente
# via @netlify/plugin-nextjs (não é mais um Vite/Express SPA).
# O redirect SPA antigo "/* → /index.html" foi removido por ser
# incompatível com o Next.js.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
