[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"

# Redirect para SPA — todas as rotas que não são arquivos estáticos
# devem servir o index.html (BrowserRouter)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"