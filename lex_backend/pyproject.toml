[tool.poetry]
name = "lex-backend"
version = "0.1.0"
description = "Backend for Lex agent (FastAPI + LangGraph)"
authors = ["Lucas Cardoso <lucas@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "lex_backend"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
langgraph = "^1.2.5"
pydantic = "^2.7.0"
sqlalchemy = "^2.0.30"
alembic = "^1.13.2"
python-dotenv = "^1.0.1"
PyYAML = "^6.0"

[tool.poetry.dev-dependencies]
pytest = "^8.2.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
